<!DOCTYPE html>
<html>
<head>
  <title>Login - FoodBridge</title>

  <style>
    body {
      background: #0d1a0f;
      color: #e8f5e9;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1a2b1d;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      color: #4ade80;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #2a3f2d;
      border-radius: 6px;
      background: #131f15;
      color: white;
    }

    input:focus {
      border-color: #4ade80;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4ade80;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #22c55e;
    }

    .link {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .link a {
      color: #4ade80;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="link">
    Don’t have an account? <a href="signup.html">Signup</a>
  </div>
</div>

<script>
function login() {
  fetch('http://localhost:3000/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: email.value,
      password: password.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.user) {
      alert("Login successful!");
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "index.html";
    } else {
      alert("Invalid credentials");
    }
  });
}
</script>

</body>
</html>
