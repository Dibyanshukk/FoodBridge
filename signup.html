<!DOCTYPE html>
<html>
<head>
  <title>Signup - FoodBridge</title>

  <style>
    body {
      background: #0d1a0f;
      color: #e8f5e9;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1a2b1d;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      color: #4ade80;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #2a3f2d;
      border-radius: 6px;
      background: #131f15;
      color: white;
    }

    input:focus, select:focus {
      border-color: #4ade80;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4ade80;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #22c55e;
    }

    .link {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .link a {
      color: #4ade80;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Signup</h2>

  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <select id="role">
    <option value="donor">Donor</option>
    <option value="ngo">NGO</option>
    <option value="volunteer">Volunteer</option>
  </select>

  <button onclick="signup()">Signup</button>

  <div class="link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
function signup() {
  const nameVal = document.getElementById("name").value.trim();
  const emailVal = document.getElementById("email").value.trim();
  const passwordVal = document.getElementById("password").value.trim();
  const roleVal = document.getElementById("role").value;

  console.log(nameVal, emailVal, passwordVal, roleVal); // DEBUG

  fetch('http://localhost:3000/signup', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      name: nameVal,
      email: emailVal,
      password: passwordVal,
      role: roleVal
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log(data);

    if (data.message) {
      alert("Signup successful!");
      window.location.href = "login.html";
    } else {
      alert(data.error);
    }
  })
  .catch(err => {
    console.log(err);
    alert("Server error");
  });
}
</script>

</body>
</html>
